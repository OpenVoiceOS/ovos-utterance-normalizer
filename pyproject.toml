[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-utterance-normalizer"
dynamic = ["version"]
readme = "README.md"
authors = [
    {name = "jarbasai", email = "jarbasai@mailfence.com"}
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6"
]
dependencies = [
    "ovos-utils>=0.0.38,<1.0.0",
    "quebra-frases",
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ftfy"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-utterance-normalizer"

[project.entry-points."opm.transformer.text"]
"ovos-utterance-normalizer" = "ovos_utterance_normalizer:UtteranceNormalizerPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_utterance_normalizer.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_utterance_normalizer*"]

[tool.setuptools.package-data]
ovos_utterance_normalizer = ["res/**/*"]
